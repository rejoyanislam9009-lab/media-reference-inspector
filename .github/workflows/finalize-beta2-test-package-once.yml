name: Finalize Media Reference Inspector 2.2.0 beta.2 test package

on:
  push:
    branches:
      - agent/2.2.0-beta-media-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize 2.2.0 beta.2 test package'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/2.2.0-beta-media-audit
          fetch-depth: 0

      - name: Fix Page Audit post type scope
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('includes/class-mediarefinspector-plugin.php')
          text = p.read_text()
          old = "\t\t\t$args = array( 'post_type' => get_post_types( array( 'public' => true ), 'names' ), 'post_status' => array( 'publish', 'draft', 'pending', 'private' ), 'posts_per_page' => 30, 'orderby' => 'modified', 'order' => 'DESC', 'post_type__not_in' => array( 'attachment' ) );"
          new = "\t\t\t$post_types = get_post_types( array( 'public' => true ), 'names' );\n\t\t\tunset( $post_types['attachment'] );\n\t\t\t$args = array( 'post_type' => array_values( $post_types ), 'post_status' => array( 'publish', 'draft', 'pending', 'private' ), 'posts_per_page' => 30, 'orderby' => 'modified', 'order' => 'DESC' );"
          if old not in text:
              raise SystemExit('Expected Page Audit query anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Validate test source
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.2\.0-beta\.2[[:space:]]*$' media-reference-inspector.php
          grep -Eq '^Stable tag:[[:space:]]+2\.1\.0[[:space:]]*$' readme.txt
          ! grep -q 'post_type__not_in' includes/class-mediarefinspector-plugin.php
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js

      - name: Commit final beta test source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-mediarefinspector-plugin.php
          git commit -m "Polish 2.2.0-beta.2 Page Audit scope"
          git push origin HEAD:agent/2.2.0-beta-media-audit

      - name: Build clean installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mri-package
          mkdir -p /tmp/mri-package/media-reference-inspector
          git archive HEAD | tar -x -C /tmp/mri-package/media-reference-inspector
          rm -rf /tmp/mri-package/media-reference-inspector/.github /tmp/mri-package/media-reference-inspector/.wordpress-org
          rm -f /tmp/mri-package/media-reference-inspector/.gitattributes /tmp/mri-package/media-reference-inspector/README.md /tmp/mri-package/media-reference-inspector/.finalize-beta2-trigger
          cd /tmp/mri-package
          zip -qr "$GITHUB_WORKSPACE/media-reference-inspector-2.2.0-beta.2.zip" media-reference-inspector

      - name: Upload clean test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: media-reference-inspector-2.2.0-beta.2-clean
          path: media-reference-inspector-2.2.0-beta.2.zip
          if-no-files-found: error
