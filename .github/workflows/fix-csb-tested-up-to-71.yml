name: Fix CSB Tested up to 7.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-csb-tested-up-to-71.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: rejoyan9009
      SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
      SLUG: category-submenu-builder
    steps:
      - uses: actions/checkout@v4

      - name: Update trunk and stable tag readme
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          STATUS_FILE="$GITHUB_WORKSPACE/csb-tested-up-to-status.txt"
          rm -f "$STATUS_FILE"
          fail() { printf 'FAILED\nPlugin: %s\nReason: %s\n' "$SLUG" "$1" > "$STATUS_FILE"; exit 1; }
          [ -n "${SVN_PASSWORD:-}" ] || fail "WORDPRESS_SVN_PASSWORD secret unavailable"
          sudo apt-get update -y >/dev/null || fail "apt update failed"
          sudo apt-get install -y subversion >/dev/null || fail "subversion install failed"
          SVN_DIR="$HOME/svn-$SLUG"
          rm -rf "$SVN_DIR"
          svn checkout --depth immediates "https://plugins.svn.wordpress.org/$SLUG/" "$SVN_DIR" >/tmp/csb-tu-checkout.log 2>&1 || fail "SVN checkout failed"
          cd "$SVN_DIR"
          svn update --set-depth infinity trunk >/dev/null 2>&1 || fail "SVN trunk update failed"
          svn update --set-depth infinity tags/3.0.0 >/dev/null 2>&1 || fail "SVN stable tag update failed"
          python3 - <<'PY'
          from pathlib import Path
          for rel in ('trunk/readme.txt', 'tags/3.0.0/readme.txt'):
              p=Path(rel)
              if not p.exists():
                  raise SystemExit(f'missing {rel}')
              text=p.read_text(encoding='utf-8')
              lines=text.splitlines()
              changed=False
              for i,line in enumerate(lines):
                  if line.startswith('Tested up to:'):
                      if line != 'Tested up to: 7.1':
                          lines[i]='Tested up to: 7.1'
                          changed=True
                      break
              else:
                  raise SystemExit(f'No Tested up to header in {rel}')
              if changed:
                  p.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          [ $? -eq 0 ] || fail "readme update failed"
          grep -q '^Tested up to: 7.1$' trunk/readme.txt || fail "trunk not 7.1"
          grep -q '^Tested up to: 7.1$' tags/3.0.0/readme.txt || fail "tag not 7.1"
          if [ -z "$(svn status trunk/readme.txt tags/3.0.0/readme.txt)" ]; then
            printf 'SUCCESS\nPlugin: %s\nNo SVN changes needed\nTrunk: Tested up to 7.1\nTag 3.0.0: Tested up to 7.1\n' "$SLUG" > "$STATUS_FILE"
            exit 0
          fi
          if ! svn commit trunk/readme.txt tags/3.0.0/readme.txt -m "Update Category Submenu Builder compatibility to WordPress 7.1" --no-auth-cache --non-interactive --username "$SVN_USERNAME" --password "$SVN_PASSWORD" >/tmp/csb-tu-commit.log 2>&1; then
            fail "SVN commit failed"
          fi
          REVISION=$(grep -Eo 'Committed revision [0-9]+' /tmp/csb-tu-commit.log | tail -1 || true)
          printf 'SUCCESS\nPlugin: %s\n%s\nTrunk: Tested up to 7.1\nTag 3.0.0: Tested up to 7.1\n' "$SLUG" "${REVISION:-Committed successfully}" > "$STATUS_FILE"

      - name: Record sanitized status
        if: always()
        shell: bash
        run: |
          set -e
          STATUS_FILE="csb-tested-up-to-status.txt"
          [ -f "$STATUS_FILE" ] || printf 'FAILED\nPlugin: category-submenu-builder\nReason: no status produced\n' > "$STATUS_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Record CSB Tested up to 7.1 deploy status"
            git push
          fi

      - name: Preserve deployment outcome
        if: steps.deploy.outcome == 'failure'
        run: exit 1
