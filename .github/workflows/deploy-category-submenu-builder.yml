name: Deploy Category Submenu Builder to WordPress.org

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-category-submenu-builder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: rejoyan9009
      SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
      SLUG: category-submenu-builder
      VERSION: 3.0.0
      ZIP_URL: https://wordpress.org/plugins/files/2026/08/18_03-01-24_category-submenu-builder-3.0.0-review-fix2-wordpress-org.zip
    steps:
      - name: Check out helper repository
        uses: actions/checkout@v4

      - name: Deploy approved release
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          STATUS_FILE="$GITHUB_WORKSPACE/category-submenu-builder-deploy-status.txt"
          rm -f "$STATUS_FILE"

          fail() {
            printf 'FAILED\nPlugin: %s\nVersion: %s\nReason: %s\n' "$SLUG" "$VERSION" "$1" > "$STATUS_FILE"
            exit 1
          }

          [ -n "${SVN_PASSWORD:-}" ] || fail "GitHub secret WORDPRESS_SVN_PASSWORD is not available in this repository."

          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null || fail "Could not update package index."
            sudo apt-get install -y subversion >/dev/null || fail "Could not install Subversion."
          fi

          rm -rf /tmp/csb-package /tmp/csb.zip "$HOME/svn-$SLUG"
          mkdir -p /tmp/csb-package

          curl -fL --retry 3 --retry-delay 2 "$ZIP_URL" -o /tmp/csb.zip || fail "Could not download the approved WordPress.org submission ZIP."
          unzip -q /tmp/csb.zip -d /tmp/csb-package || fail "Approved ZIP could not be extracted."

          SOURCE_DIR="/tmp/csb-package/$SLUG"
          [ -f "$SOURCE_DIR/category-submenu-builder.php" ] || fail "Main plugin file is missing from the approved ZIP."
          [ -f "$SOURCE_DIR/readme.txt" ] || fail "readme.txt is missing from the approved ZIP."
          grep -Eq '^[[:space:]]*\*[[:space:]]*Version:[[:space:]]+3\.0\.0[[:space:]]*\*?/?[[:space:]]*$|^[[:space:]]*Version:[[:space:]]+3\.0\.0[[:space:]]*$' "$SOURCE_DIR/category-submenu-builder.php" || fail "Plugin header version is not 3.0.0."
          grep -Eq '^Stable tag:[[:space:]]+3\.0\.0[[:space:]]*$' "$SOURCE_DIR/readme.txt" || fail "readme.txt Stable tag is not 3.0.0."

          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || fail "PHP syntax validation failed."
          done < <(find "$SOURCE_DIR" -type f -name '*.php' -print0)

          SVN_DIR="$HOME/svn-$SLUG"
          svn checkout "https://plugins.svn.wordpress.org/$SLUG/" "$SVN_DIR" >/tmp/csb-svn-checkout.log 2>&1 || fail "Could not check out the WordPress.org SVN repository. Commit access may not be active yet."

          if svn ls "https://plugins.svn.wordpress.org/$SLUG/tags/$VERSION/" >/dev/null 2>&1; then
            printf 'ALREADY_PUBLISHED\nPlugin: %s\nVersion: %s\nWordPress.org: https://wordpress.org/plugins/%s/\n' "$SLUG" "$VERSION" "$SLUG" > "$STATUS_FILE"
            exit 0
          fi

          mkdir -p "$SVN_DIR/trunk" "$SVN_DIR/tags"
          rsync -a --delete "$SOURCE_DIR/" "$SVN_DIR/trunk/" || fail "Could not copy the approved release into SVN trunk."

          cd "$SVN_DIR" || fail "Could not enter SVN working copy."
          svn add --force trunk >/dev/null || fail "Could not add trunk files to SVN."
          while IFS= read -r path; do
            [ -n "$path" ] && svn rm --force "$path" >/dev/null
          done < <(svn status trunk | awk '/^!/ { sub(/^! +/, ""); print }')

          svn copy trunk "tags/$VERSION" >/dev/null || fail "Could not create the 3.0.0 SVN tag."

          if ! svn commit . \
            -m "Release Category Submenu Builder $VERSION by rejoyan9009" \
            --no-auth-cache \
            --non-interactive \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" >/tmp/csb-svn-commit.log 2>&1; then
            fail "SVN commit failed. Check SVN credentials/access."
          fi

          REVISION=$(grep -Eo 'Committed revision [0-9]+' /tmp/csb-svn-commit.log | tail -1 || true)
          printf 'SUCCESS\nPlugin: %s\nVersion: %s\n%s\nWordPress.org: https://wordpress.org/plugins/%s/\nSVN: https://plugins.svn.wordpress.org/%s/\n' "$SLUG" "$VERSION" "${REVISION:-Committed successfully}" "$SLUG" "$SLUG" > "$STATUS_FILE"

      - name: Record sanitized deployment status
        if: always()
        shell: bash
        run: |
          set -e
          STATUS_FILE="category-submenu-builder-deploy-status.txt"
          if [ ! -f "$STATUS_FILE" ]; then
            printf 'FAILED\nPlugin: category-submenu-builder\nVersion: 3.0.0\nReason: Deployment stopped before a status could be recorded.\n' > "$STATUS_FILE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Record Category Submenu Builder SVN deploy status"
            git push
          fi

      - name: Preserve deployment outcome
        if: steps.deploy.outcome == 'failure'
        run: exit 1
