name: Deploy Media Reference Inspector 2.3.0 once

on:
  push:
    branches:
      - main
    paths:
      - ".release/deploy-2.3.0-r2"

permissions:
  contents: write

jobs:
  deploy:
    name: Validate and deploy 2.3.0
    runs-on: ubuntu-latest
    env:
      VERSION: "2.3.0"
      SVN_USERNAME: rejoyan9009
      SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
      SLUG: media-reference-inspector
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate, deploy, and record result
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGE=validation
          RESULT_FILE="$GITHUB_WORKSPACE/.release/deploy-2.3.0-result"

          record_result() {
            code=$?
            set +e
            if [ "$code" -eq 0 ]; then
              status=success
            else
              status=failure
            fi
            cd "$GITHUB_WORKSPACE"
            mkdir -p .release
            printf 'status=%s\nstage=%s\nsource_commit=%s\n' "$status" "$STAGE" "$GITHUB_SHA" > "$RESULT_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .release/deploy-2.3.0-result
            git commit -m "Record WordPress.org 2.3.0 deploy: $status ($STAGE)" >/dev/null 2>&1 || true
            git push origin HEAD:main >/dev/null 2>&1 || true
            exit "$code"
          }
          trap record_result EXIT

          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.3\.0[[:space:]]*$' media-reference-inspector.php
          grep -Eq '^Stable tag:[[:space:]]+2\.3\.0[[:space:]]*$' readme.txt
          ! grep -q '2.3.0-beta.1' media-reference-inspector.php
          ! grep -q '^Stable tag:[[:space:]]+2\.2\.0[[:space:]]*$' readme.txt
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js

          STAGE=svn-setup
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y subversion
          fi

          SVN_DIR="${HOME}/svn-${SLUG}"
          EXPORT_DIR="${HOME}/export-${SLUG}"
          svn checkout --depth immediates "https://plugins.svn.wordpress.org/${SLUG}/" "$SVN_DIR"
          cd "$SVN_DIR"
          svn update --set-depth infinity assets
          svn update --set-depth infinity trunk
          svn update --set-depth immediates tags

          STAGE=tag-check
          if [ -d "tags/$VERSION" ]; then
            svn cat "tags/$VERSION/media-reference-inspector.php" > /tmp/mri-published-plugin.php
            svn cat "tags/$VERSION/readme.txt" > /tmp/mri-published-readme.txt
            grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.3\.0[[:space:]]*$' /tmp/mri-published-plugin.php
            grep -Eq '^Stable tag:[[:space:]]+2\.3\.0[[:space:]]*$' /tmp/mri-published-readme.txt
            STAGE=already-published
            exit 0
          fi

          STAGE=package
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR/assets" "$EXPORT_DIR/includes"
          cp "$GITHUB_WORKSPACE/media-reference-inspector.php" "$EXPORT_DIR/"
          cp "$GITHUB_WORKSPACE/readme.txt" "$EXPORT_DIR/"
          cp -R "$GITHUB_WORKSPACE/assets/." "$EXPORT_DIR/assets/"
          cp -R "$GITHUB_WORKSPACE/includes/." "$EXPORT_DIR/includes/"

          STAGE=svn-sync
          cd "$SVN_DIR"
          rsync -rc --delete "$EXPORT_DIR/" trunk/
          rsync -rc --delete "$GITHUB_WORKSPACE/.wordpress-org/" assets/
          svn add trunk assets --force >/dev/null
          while IFS= read -r path; do
            [ -n "$path" ] && svn rm "$path"
          done < <(svn status trunk assets | awk '/^!/ { sub(/^! +/, ""); print }')
          svn cp trunk "tags/$VERSION"

          if compgen -G "assets/*.png" > /dev/null; then
            svn propset svn:mime-type image/png assets/*.png >/dev/null
          fi
          if compgen -G "assets/*.jpg" > /dev/null; then
            svn propset svn:mime-type image/jpeg assets/*.jpg >/dev/null
          fi
          if compgen -G "assets/*.svg" > /dev/null; then
            svn propset svn:mime-type image/svg+xml assets/*.svg >/dev/null || true
          fi

          STAGE=svn-commit
          svn update
          svn status
          svn commit \
            -m "Release Media Reference Inspector $VERSION by rejoyan9009" \
            --no-auth-cache \
            --non-interactive \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD"

          STAGE=complete
          echo "Plugin version $VERSION deployed to WordPress.org."
