name: Deploy Media Reference Inspector 2.1.0 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-2.1.0-once.yml"

permissions:
  contents: write

jobs:
  deploy:
    name: Validate, commit source, and deploy 2.1.0
    runs-on: ubuntu-latest
    env:
      VERSION: "2.1.0"
      SLUG: media-reference-inspector
      SVN_USERNAME: rejoyan9009
      SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and validate release package
        shell: bash
        run: |
          set -euo pipefail
          cat .release/mri210.part1 .release/mri210.part2 .release/mri210.part3 .release/mri210.part4 | base64 --decode > /tmp/mri210.tar.xz
          echo "dac4ea203c17b9131f201e21e29fa601277701d97ad0042c306c60cbf40cb284  /tmp/mri210.tar.xz" | sha256sum -c -
          mkdir -p /tmp/mri210-release
          tar -xJf /tmp/mri210.tar.xz -C /tmp/mri210-release
          PKG=/tmp/mri210-release/media-reference-inspector
          test -f "$PKG/media-reference-inspector.php"
          test -f "$PKG/readme.txt"
          test -f "$PKG/assets/css/admin.css"
          test -f "$PKG/assets/js/admin.js"
          grep -Eq "^[[:space:]]*\* Version:[[:space:]]+${VERSION}[[:space:]]*$" "$PKG/media-reference-inspector.php"
          grep -Eq "^Stable tag:[[:space:]]+${VERSION}[[:space:]]*$" "$PKG/readme.txt"
          find "$PKG" -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check "$PKG/assets/js/admin.js"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Commit 2.1.0 source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets includes
          cp -a "$PKG/assets" ./assets
          cp -a "$PKG/includes" ./includes
          cp "$PKG/media-reference-inspector.php" ./media-reference-inspector.php
          cp "$PKG/readme.txt" ./readme.txt
          git config user.name "rejoyanislam9009-lab"
          git config user.email "rejoyanislam9009@gmail.com"
          git add assets includes media-reference-inspector.php readme.txt
          if ! git diff --cached --quiet; then
            git commit -m "Release Media Reference Inspector 2.1.0"
            git push origin HEAD:main
          fi

      - name: Install Subversion
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y subversion
          fi

      - name: Deploy 2.1.0 to WordPress.org SVN
        shell: bash
        run: |
          set -euo pipefail
          SVN_DIR="${HOME}/svn-${SLUG}"
          svn checkout --depth immediates "https://plugins.svn.wordpress.org/${SLUG}/" "$SVN_DIR"
          cd "$SVN_DIR"
          svn update --set-depth infinity assets
          svn update --set-depth infinity trunk
          svn update --set-depth immediates tags
          if [ -d "tags/$VERSION" ]; then
            echo "Version $VERSION is already published; refusing to rewrite an existing tag."
            exit 1
          fi
          rsync -rc --delete "$PKG/" trunk/
          rsync -rc --delete "$GITHUB_WORKSPACE/.wordpress-org/" assets/
          svn add trunk assets --force >/dev/null
          while IFS= read -r path; do
            [ -n "$path" ] && svn rm "$path"
          done < <(svn status trunk assets | awk '/^!/ { sub(/^! +/, ""); print }')
          svn cp trunk "tags/$VERSION"
          if compgen -G "assets/*.png" > /dev/null; then svn propset svn:mime-type image/png assets/*.png >/dev/null; fi
          if compgen -G "assets/*.jpg" > /dev/null; then svn propset svn:mime-type image/jpeg assets/*.jpg >/dev/null; fi
          if compgen -G "assets/*.svg" > /dev/null; then svn propset svn:mime-type image/svg+xml assets/*.svg >/dev/null || true; fi
          svn update
          svn status
          svn commit \
            -m "Release Media Reference Inspector $VERSION by rejoyan9009" \
            --no-auth-cache \
            --non-interactive \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD"
          echo "Plugin version $VERSION deployed to WordPress.org."

      - name: Remove one-time release staging
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git pull --ff-only origin main
          git rm -f .release/mri210.part1 .release/mri210.part2 .release/mri210.part3 .release/mri210.part4 .github/workflows/deploy-2.1.0-once.yml
          rmdir .release 2>/dev/null || true
          git commit -m "Remove one-time 2.1.0 release staging"
          git push origin HEAD:main
