name: Deploy Category Submenu Builder icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-category-submenu-builder-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-icon:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: rejoyan9009
      SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
      SLUG: category-submenu-builder
      SVG_URL: https://raw.githubusercontent.com/rejoyanislam9009-lab/category-submenu-builder/main/.wordpress-org/icon.svg
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy icon assets
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          STATUS_FILE="$GITHUB_WORKSPACE/category-submenu-builder-icon-status.txt"
          rm -f "$STATUS_FILE"
          fail() {
            printf 'FAILED\nPlugin: %s\nReason: %s\n' "$SLUG" "$1" > "$STATUS_FILE"
            exit 1
          }
          [ -n "${SVN_PASSWORD:-}" ] || fail "WORDPRESS_SVN_PASSWORD secret unavailable."
          sudo apt-get update -y >/dev/null || fail "apt update failed"
          sudo apt-get install -y subversion librsvg2-bin >/dev/null || fail "required packages failed"
          rm -rf /tmp/csb-icon "$HOME/svn-$SLUG"
          mkdir -p /tmp/csb-icon
          curl -fL "$SVG_URL" -o /tmp/csb-icon/icon.svg || fail "could not download icon.svg"
          rsvg-convert -w 256 -h 256 /tmp/csb-icon/icon.svg -o /tmp/csb-icon/icon-256x256.png || fail "256px render failed"
          rsvg-convert -w 128 -h 128 /tmp/csb-icon/icon.svg -o /tmp/csb-icon/icon-128x128.png || fail "128px render failed"
          file /tmp/csb-icon/icon-256x256.png | grep -q '256 x 256' || fail "256px dimensions invalid"
          file /tmp/csb-icon/icon-128x128.png | grep -q '128 x 128' || fail "128px dimensions invalid"

          SVN_DIR="$HOME/svn-$SLUG"
          svn checkout --depth immediates "https://plugins.svn.wordpress.org/$SLUG/" "$SVN_DIR" >/tmp/csb-icon-checkout.log 2>&1 || fail "SVN checkout failed"
          cd "$SVN_DIR"
          svn update --set-depth infinity assets >/dev/null 2>&1 || true
          mkdir -p assets
          cp /tmp/csb-icon/icon.svg assets/icon.svg
          cp /tmp/csb-icon/icon-128x128.png assets/icon-128x128.png
          cp /tmp/csb-icon/icon-256x256.png assets/icon-256x256.png
          svn add --force assets >/dev/null || fail "svn add failed"
          svn propset svn:mime-type image/png assets/icon-128x128.png assets/icon-256x256.png >/dev/null || true
          svn propset svn:mime-type image/svg+xml assets/icon.svg >/dev/null || true
          if ! svn commit assets -m "Add Category Submenu Builder plugin icon" --no-auth-cache --non-interactive --username "$SVN_USERNAME" --password "$SVN_PASSWORD" >/tmp/csb-icon-commit.log 2>&1; then
            fail "SVN icon commit failed"
          fi
          REVISION=$(grep -Eo 'Committed revision [0-9]+' /tmp/csb-icon-commit.log | tail -1 || true)
          printf 'SUCCESS\nPlugin: %s\n%s\nAssets: icon.svg, icon-128x128.png, icon-256x256.png\n' "$SLUG" "${REVISION:-Committed successfully}" > "$STATUS_FILE"

      - name: Record sanitized status
        if: always()
        shell: bash
        run: |
          set -e
          STATUS_FILE="category-submenu-builder-icon-status.txt"
          [ -f "$STATUS_FILE" ] || printf 'FAILED\nPlugin: category-submenu-builder\nReason: no status produced\n' > "$STATUS_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Record Category Submenu Builder icon deploy status"
            git push
          fi

      - name: Preserve deployment outcome
        if: steps.deploy.outcome == 'failure'
        run: exit 1
