name: Release Media Reference Inspector 2.4.1 once

on:
  push:
    branches:
      - main
    paths:
      - '.release-trigger-2.4.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: '2.4.1'
      SLUG: media-reference-inspector
      SVN_USERNAME: rejoyan9009
      SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact stable release
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.4\.1[[:space:]]*$' media-reference-inspector.php
          grep -Eq "define\( 'MEDIAREFINSPECTOR_VERSION', '2\.4\.1' \);" media-reference-inspector.php
          grep -Eq '^Stable tag:[[:space:]]+2\.4\.1[[:space:]]*$' readme.txt
          grep -Eq '^Tested up to:[[:space:]]+7\.1[[:space:]]*$' readme.txt
          grep -Eq '^== Screenshots ==$' readme.txt
          for n in 1 2 3 4 5; do test -s ".wordpress-org/screenshot-${n}.jpg"; done
          ! grep -R -F '2.4.1-beta' media-reference-inspector.php readme.txt includes assets
          find media-reference-inspector.php includes -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js

      - name: Build clean WordPress package
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_DIR="$HOME/export-${SLUG}"
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR/assets/css" "$EXPORT_DIR/assets/js" "$EXPORT_DIR/includes"
          cp media-reference-inspector.php readme.txt "$EXPORT_DIR/"
          cp assets/css/admin.css "$EXPORT_DIR/assets/css/"
          cp assets/js/admin.js "$EXPORT_DIR/assets/js/"
          cp includes/*.php "$EXPORT_DIR/includes/"
          find "$EXPORT_DIR" -type f -print | sort

      - name: Install Subversion
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y subversion
          fi

      - name: Deploy or verify WordPress.org SVN
        id: svn
        shell: bash
        run: |
          set -euo pipefail
          SVN_DIR="$HOME/svn-${SLUG}"
          EXPORT_DIR="$HOME/export-${SLUG}"
          svn checkout --depth immediates "https://plugins.svn.wordpress.org/${SLUG}/" "$SVN_DIR"
          cd "$SVN_DIR"
          svn update --set-depth infinity assets
          svn update --set-depth infinity trunk
          svn update --set-depth immediates tags

          if [ -d "tags/$VERSION" ]; then
            svn update --set-depth infinity "tags/$VERSION"
            grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.4\.1[[:space:]]*$' "tags/$VERSION/media-reference-inspector.php"
            grep -Eq '^Stable tag:[[:space:]]+2\.4\.1[[:space:]]*$' "tags/$VERSION/readme.txt"
            grep -Eq '^== Screenshots ==$' "tags/$VERSION/readme.txt"
            REVISION="$(svn info --show-item revision "tags/$VERSION")"
            echo "result=success-existing revision=$REVISION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rsync -rc --delete "$EXPORT_DIR/" trunk/
          rsync -rc --delete "$GITHUB_WORKSPACE/.wordpress-org/" assets/

          svn add trunk assets --force >/dev/null
          while IFS= read -r path; do
            [ -n "$path" ] && svn rm "$path"
          done < <(svn status trunk assets | awk '/^!/ { sub(/^! +/, ""); print }')

          svn cp trunk "tags/$VERSION"

          if compgen -G 'assets/*.png' > /dev/null; then
            svn propset svn:mime-type image/png assets/*.png >/dev/null
          fi
          if compgen -G 'assets/*.jpg' > /dev/null; then
            svn propset svn:mime-type image/jpeg assets/*.jpg >/dev/null
          fi
          if compgen -G 'assets/*.svg' > /dev/null; then
            svn propset svn:mime-type image/svg+xml assets/*.svg >/dev/null || true
          fi

          svn update
          svn status
          svn commit \
            -m "Release Media Reference Inspector $VERSION by rejoyan9009" \
            --no-auth-cache \
            --non-interactive \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD"

          svn update "tags/$VERSION"
          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.4\.1[[:space:]]*$' "tags/$VERSION/media-reference-inspector.php"
          grep -Eq '^Stable tag:[[:space:]]+2\.4\.1[[:space:]]*$' "tags/$VERSION/readme.txt"
          grep -Eq '^== Screenshots ==$' "tags/$VERSION/readme.txt"
          REVISION="$(svn info --show-item revision "tags/$VERSION")"
          echo "result=success revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Record verified release result
        shell: bash
        env:
          RELEASE_RESULT: ${{ steps.svn.outputs.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_RESULT" > .release-result-2.4.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add .release-result-2.4.1
          git commit -m "Record verified WordPress.org 2.4.1 release"
          git push origin HEAD:main
