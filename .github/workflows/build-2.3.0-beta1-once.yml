name: Build Media Reference Inspector 2.3.0 beta.1 once

on:
  push:
    branches:
      - agent/2.3.0-audit-workflow

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Trigger 2.3.0 beta.1 build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/2.3.0-audit-workflow
          fetch-depth: 0

      - name: Apply 2.3.0 beta changes
        run: python3 .github/scripts/build-2.3.0-beta1.py

      - name: Validate beta source
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.3\.0-beta\.1[[:space:]]*$' media-reference-inspector.php
          grep -Eq '^Stable tag:[[:space:]]+2\.2\.0[[:space:]]*$' readme.txt
          grep -q 'MediaRefInspector_Insights_Scanner' media-reference-inspector.php
          grep -q "'broken'" includes/class-mediarefinspector-plugin.php
          grep -q 'mediarefinspector-export-html' includes/class-mediarefinspector-plugin.php
          grep -q 'source_category' includes/class-mediarefinspector-insights-scanner.php
          ! grep -q "'diagnostics'" includes/class-mediarefinspector-plugin.php
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js

      - name: Commit beta source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-reference-inspector.php readme.txt assets/css/admin.css assets/js/admin.js includes/class-mediarefinspector-plugin.php includes/class-mediarefinspector-insights-scanner.php
          git commit -m "Build 2.3.0-beta.1 audit workflow"
          git push origin HEAD:agent/2.3.0-audit-workflow

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mri-package
          mkdir -p /tmp/mri-package/media-reference-inspector
          git archive HEAD | tar -x -C /tmp/mri-package/media-reference-inspector
          cd /tmp/mri-package
          zip -qr "$GITHUB_WORKSPACE/media-reference-inspector-2.3.0-beta.1.zip" media-reference-inspector
          cd "$GITHUB_WORKSPACE"
          unzip -l media-reference-inspector-2.3.0-beta.1.zip

      - name: Upload beta ZIP
        uses: actions/upload-artifact@v4
        with:
          name: media-reference-inspector-2.3.0-beta.1
          path: media-reference-inspector-2.3.0-beta.1.zip
          if-no-files-found: error
