name: Verify WordPress.org 2.3.0 once

on:
  push:
    branches:
      - main
    paths:
      - ".release/verify-2.3.0"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Subversion
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y subversion
          fi

      - name: Verify WordPress.org tag and record result
        shell: bash
        run: |
          set -uo pipefail
          STATUS=failure
          for i in $(seq 1 30); do
            if svn ls "https://plugins.svn.wordpress.org/media-reference-inspector/tags/2.3.0/" >/tmp/mri-svn-list 2>/dev/null; then
              if svn cat "https://plugins.svn.wordpress.org/media-reference-inspector/tags/2.3.0/media-reference-inspector.php" >/tmp/mri-plugin.php 2>/dev/null \
                && svn cat "https://plugins.svn.wordpress.org/media-reference-inspector/tags/2.3.0/readme.txt" >/tmp/mri-readme.txt 2>/dev/null \
                && grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.3\.0[[:space:]]*$' /tmp/mri-plugin.php \
                && grep -Eq '^Stable tag:[[:space:]]+2\.3\.0[[:space:]]*$' /tmp/mri-readme.txt; then
                STATUS=success
                break
              fi
            fi
            sleep 5
          done

          printf '%s\n' "$STATUS" > .release/verify-2.3.0-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release/verify-2.3.0-result
          git commit -m "Record WordPress.org 2.3.0 verification: $STATUS"
          git push origin HEAD:main

          test "$STATUS" = success
