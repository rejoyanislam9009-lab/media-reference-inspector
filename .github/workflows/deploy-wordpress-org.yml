name: Deploy to WordPress.org

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish to WordPress.org
        required: true
        default: "1.1.0"
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy plugin release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          grep -Eq "^[[:space:]]*\* Version:[[:space:]]+$VERSION[[:space:]]*$" media-reference-inspector.php
          grep -Eq "^Stable tag:[[:space:]]+$VERSION[[:space:]]*$" readme.txt
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: rejoyan9009
          SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
          SLUG: media-reference-inspector
          VERSION: ${{ env.VERSION }}
