name: Deploy CSB search metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-csb-search-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: rejoyan9009
      SVN_PASSWORD: ${{ secrets.WORDPRESS_SVN_PASSWORD }}
      SLUG: category-submenu-builder
      README_URL: https://raw.githubusercontent.com/rejoyanislam9009-lab/category-submenu-builder/main/readme.txt
    steps:
      - uses: actions/checkout@v4
      - name: Update WordPress.org readme metadata
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          STATUS_FILE="$GITHUB_WORKSPACE/csb-search-metadata-status.txt"
          rm -f "$STATUS_FILE"
          fail() { printf 'FAILED\nPlugin: %s\nReason: %s\n' "$SLUG" "$1" > "$STATUS_FILE"; exit 1; }
          [ -n "${SVN_PASSWORD:-}" ] || fail "WORDPRESS_SVN_PASSWORD secret unavailable"
          sudo apt-get update -y >/dev/null || fail "apt update failed"
          sudo apt-get install -y subversion curl >/dev/null || fail "required packages failed"
          curl -fL "$README_URL" -o /tmp/csb-readme.txt || fail "could not download optimized readme"
          grep -q '^Tags: category menu, submenu, woocommerce, menu builder, category navigation$' /tmp/csb-readme.txt || fail "optimized tags not found"
          SVN_DIR="$HOME/svn-$SLUG"
          rm -rf "$SVN_DIR"
          svn checkout --depth immediates "https://plugins.svn.wordpress.org/$SLUG/" "$SVN_DIR" >/tmp/csb-readme-checkout.log 2>&1 || fail "SVN checkout failed"
          cd "$SVN_DIR"
          svn update --set-depth infinity trunk >/dev/null 2>&1 || fail "SVN trunk update failed"
          cp /tmp/csb-readme.txt trunk/readme.txt
          if [ -z "$(svn status trunk/readme.txt)" ]; then
            printf 'SUCCESS\nPlugin: %s\nNo SVN changes needed\nTags: category menu, submenu, woocommerce, menu builder, category navigation\n' "$SLUG" > "$STATUS_FILE"
            exit 0
          fi
          if ! svn commit trunk/readme.txt -m "Optimize Category Submenu Builder search metadata" --no-auth-cache --non-interactive --username "$SVN_USERNAME" --password "$SVN_PASSWORD" >/tmp/csb-readme-commit.log 2>&1; then
            fail "SVN metadata commit failed"
          fi
          REVISION=$(grep -Eo 'Committed revision [0-9]+' /tmp/csb-readme-commit.log | tail -1 || true)
          printf 'SUCCESS\nPlugin: %s\n%s\nTags: category menu, submenu, woocommerce, menu builder, category navigation\n' "$SLUG" "${REVISION:-Committed successfully}" > "$STATUS_FILE"
      - name: Record sanitized status
        if: always()
        shell: bash
        run: |
          set -e
          STATUS_FILE="csb-search-metadata-status.txt"
          [ -f "$STATUS_FILE" ] || printf 'FAILED\nPlugin: category-submenu-builder\nReason: no status produced\n' > "$STATUS_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Record CSB search metadata deploy status"
            git push
          fi
      - name: Preserve deployment outcome
        if: steps.deploy.outcome == 'failure'
        run: exit 1
