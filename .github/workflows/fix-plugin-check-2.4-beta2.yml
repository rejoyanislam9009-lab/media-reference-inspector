name: Fix and validate Media Reference Inspector 2.4.0 beta.2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6
        with:
          ref: agent/2.4.0-compat-audit
          fetch-depth: 0

      - name: Apply Plugin Check fixes once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .plugin-check-fixed-2.4-beta2 ]; then
            python3 .github/scripts/fix-plugin-check-2.4-beta2.py
          fi

      - name: Validate PHP JavaScript and release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.4\.0-beta\.2[[:space:]]*$' media-reference-inspector.php
          grep -Eq "define\( 'MEDIAREFINSPECTOR_VERSION', '2\.4\.0-beta\.2' \);" media-reference-inspector.php
          grep -Eq '^Stable tag:[[:space:]]+2\.4\.0-beta\.2[[:space:]]*$' readme.txt
          grep -Eq '^Tested up to:[[:space:]]+7\.1[[:space:]]*$' readme.txt
          ! grep -Fq "LIKE '%%[et_pb_%%'" includes/class-mediarefinspector-extended-scanner.php
          ! grep -Fq "NOT LIKE '\\\\_%'" includes/class-mediarefinspector-advanced-scanner.php
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js

      - name: Install WordPress Coding Standards
        shell: bash
        run: |
          set -euo pipefail
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress squizlabs/php_codesniffer:^3.13 wp-coding-standards/wpcs:^3.2 dealerdirect/phpcodesniffer-composer-installer:^1.0

      - name: Run targeted WordPress sniffs from the uploaded report
        shell: bash
        run: |
          set -euo pipefail
          PHPCS="$HOME/.composer/vendor/bin/phpcs"
          "$PHPCS" --standard=WordPress --extensions=php \
            --sniffs=WordPress.DB.PreparedSQL,WordPress.DB.PreparedSQLPlaceholders,WordPress.Security.NonceVerification,WordPress.WP.I18n \
            includes/class-mediarefinspector-integration-scanner.php \
            includes/class-mediarefinspector-extended-scanner.php \
            includes/class-mediarefinspector-audit-service.php \
            includes/class-mediarefinspector-insights-scanner.php \
            includes/class-mediarefinspector-enhanced-scanner.php \
            includes/class-mediarefinspector-plugin.php \
            includes/class-mediarefinspector-advanced-scanner.php

      - name: Commit validated beta.2 source once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .plugin-check-fixed-2.4-beta2 ]; then
            printf '%s\n' 'validated 2.4.0-beta.2' > .plugin-check-fixed-2.4-beta2
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add media-reference-inspector.php readme.txt includes/ .plugin-check-fixed-2.4-beta2
            git commit -m "Fix Plugin Check findings for 2.4.0 beta.2"
            git push origin HEAD:agent/2.4.0-compat-audit
          fi

      - name: Build clean installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media-reference-inspector /tmp/media-reference-inspector-2.4.0-beta.2.zip
          mkdir -p /tmp/media-reference-inspector/assets/css /tmp/media-reference-inspector/assets/js /tmp/media-reference-inspector/includes
          cp media-reference-inspector.php readme.txt /tmp/media-reference-inspector/
          cp assets/css/admin.css /tmp/media-reference-inspector/assets/css/
          cp assets/js/admin.js /tmp/media-reference-inspector/assets/js/
          cp includes/*.php /tmp/media-reference-inspector/includes/
          cd /tmp
          zip -qr media-reference-inspector-2.4.0-beta.2.zip media-reference-inspector
          unzip -t media-reference-inspector-2.4.0-beta.2.zip

      - name: Upload beta.2 test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: media-reference-inspector-2.4.0-beta.2
          path: /tmp/media-reference-inspector-2.4.0-beta.2.zip
          if-no-files-found: error
