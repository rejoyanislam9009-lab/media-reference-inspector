name: Media Reference Inspector 2.4.0 asset refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  banner-diagnostic:
    if: github.head_ref == 'assets/2.4.0-screenshots-banner'
    runs-on: ubuntu-latest
    steps:
      - name: Check out asset branch
        uses: actions/checkout@v6
        with:
          ref: assets/2.4.0-screenshots-banner

      - name: Recover banner previews and inspect corruption
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p banner-diagnostic
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile, ImageStat

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('.wordpress-org')
          out = Path('banner-diagnostic')
          for filename in ('banner-1544x500.png', 'banner-772x250.png'):
              path = root / filename
              im = Image.open(path)
              print(filename, 'declared=', im.size, 'format=', im.format, 'mode=', im.mode)
              rgb = im.convert('RGB')
              stat = ImageStat.Stat(rgb)
              print(filename, 'mean=', tuple(round(v,2) for v in stat.mean), 'extrema=', stat.extrema)
              rgb.thumbnail((772,250), Image.Resampling.LANCZOS)
              rgb.save(out / (Path(filename).stem + '-recovered.jpg'), 'JPEG', quality=92, optimize=True)
          PY

      - name: Upload recovered banner previews
        uses: actions/upload-artifact@v4
        with:
          name: banner-diagnostic-previews
          path: banner-diagnostic/*.jpg
          if-no-files-found: error
