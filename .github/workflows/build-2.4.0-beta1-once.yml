name: Build Media Reference Inspector 2.4.0 beta.1 once

on:
  push:
    branches:
      - agent/2.4.0-compat-audit
    paths:
      - ".build-trigger-2.4.0-beta1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6
        with:
          ref: agent/2.4.0-compat-audit
          fetch-depth: 0

      - name: Apply 2.4.0 beta UI and metadata patches
        run: python3 .github/scripts/build-2.4.0-beta1.py

      - name: Validate beta source
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.4\.0-beta\.1[[:space:]]*$' media-reference-inspector.php
          grep -Eq "define\( 'MEDIAREFINSPECTOR_VERSION', '2\.4\.0-beta\.1' \);" media-reference-inspector.php
          grep -Eq '^Stable tag:[[:space:]]+2\.3\.0[[:space:]]*$' readme.txt
          grep -Eq '^Tested up to:[[:space:]]+7\.1[[:space:]]*$' readme.txt
          grep -q 'MediaRefInspector_Extended_Scanner' media-reference-inspector.php
          grep -q 'MediaRefInspector_Site_Audit_Service' media-reference-inspector.php
          grep -q 'Media Impact Preview' includes/class-mediarefinspector-plugin.php
          grep -q 'Site Audit Summary' includes/class-mediarefinspector-plugin.php
          grep -q 'mediarefinspector-export-json' includes/class-mediarefinspector-plugin.php
          grep -q 'exportJson' assets/js/admin.js
          test "$(head -c 8 .wordpress-org/banner-772x250.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
          test "$(head -c 8 .wordpress-org/banner-1544x500.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
          test ! -e .wordpress-org/screenshot-1.png
          test ! -e .wordpress-org/screenshot-2.png
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js

      - name: Commit validated beta source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-reference-inspector.php readme.txt assets/css/admin.css assets/js/admin.js includes/
          if ! git diff --cached --quiet; then
            git commit -m "Build Media Reference Inspector 2.4.0 beta.1"
            git push origin HEAD:agent/2.4.0-compat-audit
          fi

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media-reference-inspector /tmp/media-reference-inspector-2.4.0-beta.1.zip
          mkdir -p /tmp/media-reference-inspector/assets/css /tmp/media-reference-inspector/assets/js /tmp/media-reference-inspector/includes
          cp media-reference-inspector.php readme.txt /tmp/media-reference-inspector/
          cp assets/css/admin.css /tmp/media-reference-inspector/assets/css/
          cp assets/js/admin.js /tmp/media-reference-inspector/assets/js/
          cp includes/*.php /tmp/media-reference-inspector/includes/
          cd /tmp
          zip -qr media-reference-inspector-2.4.0-beta.1.zip media-reference-inspector
          unzip -t media-reference-inspector-2.4.0-beta.1.zip

      - name: Upload beta ZIP
        uses: actions/upload-artifact@v4
        with:
          name: media-reference-inspector-2.4.0-beta.1
          path: /tmp/media-reference-inspector-2.4.0-beta.1.zip
          if-no-files-found: error
