name: Build Media Reference Inspector 2.2.0 beta once

on:
  push:
    branches:
      - agent/2.2.0-beta-support-ui
    paths:
      - .build-trigger-2.2.0-beta

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/2.2.0-beta-support-ui
          fetch-depth: 0

      - name: Apply beta changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/build-2.2.0-beta.py')
          text = path.read_text()
          text = text.replace("new_help = r'''", "new_help = '''")
          text = text.replace("support_css = r'''", "support_css = '''")
          path.write_text(text)
          PY
          python3 .github/scripts/build-2.2.0-beta.py

      - name: Validate beta package
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.2\.0-beta\.1[[:space:]]*$' media-reference-inspector.php
          grep -Eq '^Stable tag:[[:space:]]+2\.1\.0[[:space:]]*$' readme.txt
          ! grep -q "'diagnostics'" includes/class-mediarefinspector-plugin.php
          grep -q 'mediarefinspector_send_support_email' includes/class-mediarefinspector-plugin.php
          grep -q 'mediarefinspector-support-form' assets/css/admin.css
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js

      - name: Commit beta source to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rejoyanislam9009-lab'
          git config user.email 'rejoyanislam9009@gmail.com'
          git add media-reference-inspector.php includes/class-mediarefinspector-plugin.php assets/css/admin.css readme.txt
          git commit -m 'Prepare Media Reference Inspector 2.2.0 beta support UI'
          git push origin HEAD:agent/2.2.0-beta-support-ui

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/media-reference-inspector /tmp/media-reference-inspector-2.2.0-beta.1.zip
          mkdir -p /tmp/media-reference-inspector
          cp -a assets includes media-reference-inspector.php readme.txt /tmp/media-reference-inspector/
          cd /tmp
          zip -qr media-reference-inspector-2.2.0-beta.1.zip media-reference-inspector
          unzip -l media-reference-inspector-2.2.0-beta.1.zip
          sha256sum media-reference-inspector-2.2.0-beta.1.zip

      - name: Upload beta ZIP
        uses: actions/upload-artifact@v4
        with:
          name: media-reference-inspector-2.2.0-beta.1
          path: /tmp/media-reference-inspector-2.2.0-beta.1.zip
          if-no-files-found: error
          retention-days: 14
