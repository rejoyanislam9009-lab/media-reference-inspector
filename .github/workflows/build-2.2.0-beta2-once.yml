name: Build Media Reference Inspector 2.2.0 beta.2 once

on:
  push:
    branches:
      - agent/2.2.0-beta-media-audit

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Trigger 2.2.0 beta.2 build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/2.2.0-beta-media-audit
          fetch-depth: 0

      - name: Fix beta.2 builder anchors
        run: python3 .github/scripts/fix-beta2-final-builder.py

      - name: Apply beta.2 feature changes
        run: python3 .github/scripts/build-2.2.0-beta2-final.py

      - name: Validate beta package
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^[[:space:]]*\* Version:[[:space:]]+2\.2\.0-beta\.2[[:space:]]*$' media-reference-inspector.php
          grep -Eq '^Stable tag:[[:space:]]+2\.1\.0[[:space:]]*$' readme.txt
          grep -q "'audit'" includes/class-mediarefinspector-plugin.php
          grep -q "'duplicates'" includes/class-mediarefinspector-plugin.php
          grep -q 'mediarefinspector-new-badge' includes/class-mediarefinspector-plugin.php
          grep -q 'MediaRefInspector_Advanced_Scanner' media-reference-inspector.php
          grep -q 'MediaRefInspector_Audit_Service' media-reference-inspector.php
          grep -q 'ACF field:' includes/class-mediarefinspector-advanced-scanner.php
          ! grep -q "'diagnostics'" includes/class-mediarefinspector-plugin.php
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/admin.js

      - name: Commit beta source to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-reference-inspector.php readme.txt assets/css/admin.css assets/js/admin.js includes/class-mediarefinspector-plugin.php includes/class-mediarefinspector-audit-service.php includes/class-mediarefinspector-advanced-scanner.php
          git commit -m "Build 2.2.0-beta.2 media audit test package"
          git push origin HEAD:agent/2.2.0-beta-media-audit

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mri-package
          mkdir -p /tmp/mri-package/media-reference-inspector
          git archive HEAD | tar -x -C /tmp/mri-package/media-reference-inspector
          rm -rf /tmp/mri-package/media-reference-inspector/.github /tmp/mri-package/media-reference-inspector/.wordpress-org
          rm -f /tmp/mri-package/media-reference-inspector/.gitattributes /tmp/mri-package/media-reference-inspector/README.md
          cd /tmp/mri-package
          zip -qr "$GITHUB_WORKSPACE/media-reference-inspector-2.2.0-beta.2.zip" media-reference-inspector
          cd "$GITHUB_WORKSPACE"
          unzip -l media-reference-inspector-2.2.0-beta.2.zip

      - name: Upload beta ZIP
        uses: actions/upload-artifact@v4
        with:
          name: media-reference-inspector-2.2.0-beta.2
          path: media-reference-inspector-2.2.0-beta.2.zip
          if-no-files-found: error
