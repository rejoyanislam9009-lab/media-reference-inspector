name: Bug report
description: Report a reproducible problem with Media Reference Inspector
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please avoid posting passwords, private site data, or other secrets.
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: 1.0.2
    validations:
      required: true
  - type: input
    id: wordpress_version
    attributes:
      label: WordPress version
      placeholder: 7.0.4
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: 8.2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Media > Media References
        2. Select ...
        3. Click ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or non-sensitive details if they help explain the issue.
